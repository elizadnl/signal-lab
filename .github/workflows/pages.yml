name: Build empirical dashboard and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # Binance monthly archives are normally available early in the following month.
    - cron: '15 5 8 * *'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research engine
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run Python test suite
        run: pytest
      - name: Build checksum-verified public empirical payload
        run: |
          python scripts/run_public_empirical.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --start 2021-01
      - name: Fail closed if payload is not empirical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('dashboard/public/results.json').read_text())
          assert p['data_source']['kind'] == 'public_market_data', p['data_source']
          print('Empirical payload:', p['data_source']['label'])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install
      - name: Build interactive dashboard
        working-directory: dashboard
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
